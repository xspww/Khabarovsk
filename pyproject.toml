[tool.coverage.run]
source = ["config", "domain", "infra", "runtime", "services", "api_routes", "desktop", "core", "version"]
omit = ["tests/*", "*/__pycache__/*", "build_info.py"]
branch = true

[tool.coverage.report]
# Total gate: hermetic unit scope only (Windows/process/network/browser excluded
# from this number by nature — farm.py, account_worker.py, desktop/host.py,
# roblox_processes/window_control need a Windows+Roblox box). Roadmap 60% needs
# an integration job, not more hermetic tests. Pure-surface gate below is the
# real quality signal.
fail_under = 15
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "except ImportError:",
  "except Exception: *pass",
  "if __name__ == .__main__.:"
]
