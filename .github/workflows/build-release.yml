name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (onedir + zip)
        env:
          CRONUS_UPDATE_REPO: ${{ github.repository }}
          CRONUS_BUILD_COMMIT: ${{ github.sha }}
        run: |
          python ops/build_exe.py --windowed --onedir --zip --name CronusLauncher

      - name: Get short SHA
        id: sha
        shell: pwsh
        run: |
          $short = "${{ github.sha }}".Substring(0,7)
          "short=$short" >> $env:GITHUB_OUTPUT
          echo "short=$short"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: CronusLauncher build-${{ steps.sha.outputs.short }}
          body: |
            Automated build from `${{ github.sha }}` on `main`.
            Download `CronusLauncher-portable.zip` (recommended, fewer AV false positives) or `CronusLauncher.exe`.
          files: |
            dist/CronusLauncher-portable.zip
            dist/CronusLauncher/CronusLauncher.exe
          fail_on_unmatched_files: false
          generate_release_notes: false
