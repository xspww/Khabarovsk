name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Secret scan (no raw cookies in repo)
        shell: pwsh
        run: |
          $hits = Select-String -Path "*.py","**/*.py" -Pattern "_\|WARNING" -Recurse 2>$null | Where-Object { $_.Line -notmatch "re.compile|COOKIE_RE|redact" }
          # Allow only pattern definitions, not raw cookie values
          $raw = Select-String -Path "." -Pattern "_\|WARNING:-DO-NOT-SHARE-THIS" -Recurse 2>$null | Where-Object { $_.Line -match "_\|WARNING:-DO-NOT-SHARE-THIS\.[A-Za-z0-9+/=]{20,}" }
          if ($raw) { Write-Error "Possible raw ROBLOSECURITY cookie found"; $raw | ForEach-Object { Write-Host $_.Path":"$_.LineNumber } ; exit 1 }
          Write-Host "Secret scan passed"
