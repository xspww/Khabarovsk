name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check tag matches version.py
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".Trim()
          $line = Select-String -Path version.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $line) { Write-Error "APP_VERSION not found in version.py"; exit 1 }
          $ver = $line.Matches[0].Groups[1].Value
          if ($tag -ne "v$ver") {
            Write-Error "Tag $tag does not match version.py APP_VERSION $ver"
            exit 1
          }
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Validate updater script syntax
        shell: powershell
        run: |
          python -c "import services.app_updater as u; open('updater_check.ps1','w',encoding='utf-8').write(u._UPDATER_PS1.replace('__TIMEOUT__','90'))"
          $errs = $null; $toks = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$pwd/updater_check.ps1", [ref]$toks, [ref]$errs)
          Remove-Item updater_check.ps1 -Force
          if ($errs.Count -gt 0) { $errs | ForEach-Object { Write-Error "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "Updater script syntax OK"

      - name: Build exe icon
        run: python -c "from PIL import Image; Image.open('assets/cronus_icon.png').save('assets/cronus_icon.ico')"

      - name: Prepare signed build metadata
        shell: powershell
        env:
          CRONUS_SIGNING_CERT_PFX_BASE64: ${{ secrets.CRONUS_SIGNING_CERT_PFX_BASE64 }}
          CRONUS_SIGNING_CERT_PASSWORD: ${{ secrets.CRONUS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:CRONUS_SIGNING_CERT_PFX_BASE64 -or -not $env:CRONUS_SIGNING_CERT_PASSWORD) {
            Write-Error "Configure CRONUS_SIGNING_CERT_PFX_BASE64 and CRONUS_SIGNING_CERT_PASSWORD Actions secrets before publishing releases."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "cronus-signing.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CRONUS_SIGNING_CERT_PFX_BASE64))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath, $env:CRONUS_SIGNING_CERT_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          if (-not $cert.HasPrivateKey -or $cert.NotAfter -lt (Get-Date)) {
            Write-Error "The signing certificate is expired or has no private key."
            exit 1
          }
          $publicKey = $cert.GetPublicKeyString().ToUpperInvariant()
          $tag = "${{ github.ref_name }}"
          [System.IO.File]::WriteAllText("$pwd/build_info.py", "BUILD_TAG = `"$tag`"`nRELEASE_SIGNER_PUBLIC_KEY = `"$publicKey`"`n")
          "CRONUS_SIGNING_PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
          "CRONUS_SIGNER_PUBLIC_KEY=$publicKey" >> $env:GITHUB_ENV

      - name: Build exe
        run: pyinstaller cronus_launcher.spec

      - name: Sign executable
        shell: powershell
        env:
          CRONUS_SIGNING_CERT_PASSWORD: ${{ secrets.CRONUS_SIGNING_CERT_PASSWORD }}
        run: |
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { Write-Error "Windows SDK signtool.exe was not found."; exit 1 }
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f $env:CRONUS_SIGNING_PFX_PATH /p $env:CRONUS_SIGNING_CERT_PASSWORD "dist/CronusLauncher.exe"
            if ($LASTEXITCODE -ne 0) { Write-Error "Authenticode signing failed."; exit 1 }
            & $signtool.FullName verify /pa /all "dist/CronusLauncher.exe"
            if ($LASTEXITCODE -ne 0) { Write-Error "Signed executable failed Authenticode verification."; exit 1 }
          } finally {
            Remove-Item -LiteralPath $env:CRONUS_SIGNING_PFX_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test (guard boot, no display needed)
        shell: powershell
        run: |
          $exe = "dist/CronusLauncher.exe"
          if (-not (Test-Path $exe)) { Write-Error "Build output missing: $exe"; exit 1 }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Smoke test exe: $exe ($sizeMb MB onefile; cold extract can be slow)"
          $proc = Start-Process -FilePath (Resolve-Path $exe) `
            -ArgumentList "--multi-roblox-guard", "mutex", "--parent-pid", "$PID" `
            -PassThru -RedirectStandardOutput "guard_out.txt" -NoNewWindow
          $ready = $false
          # Onefile cold extract + Defender scan can exceed 90s on slow
          # runners (see cronus_launcher.spec notes). Allow up to 4 minutes.
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path guard_out.txt) -and (Select-String -Path guard_out.txt -Pattern "multi_roblox_guard_ready" -Quiet)) { $ready = $true; break }
            if ($proc.HasExited) { break }
            if ($i -gt 0 -and ($i % 60 -eq 0)) { Write-Host "Smoke test waiting ${i}s (proc alive)" }
          }
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          if (-not $ready) {
            Write-Host "Proc exited: $($proc.HasExited) exitCode: $(try { $proc.ExitCode } catch { 'n/a' })"
            Get-Content guard_out.txt -ErrorAction SilentlyContinue
            Write-Error "Smoke test failed: guard did not report ready"; exit 1
          }
          Write-Host "Smoke test passed"

      - name: Package exe and checksums
        shell: powershell
        run: |
          $ver = "${{ env.APP_VERSION }}"
          $exeName = "CronusLauncher-$ver.exe"
          $zipName = "CronusLauncher-$ver-portable.zip"
          Copy-Item "dist/CronusLauncher.exe" $exeName
          $portableDir = Join-Path $pwd "portable-package"
          New-Item -ItemType Directory -Force -Path (Join-Path $portableDir "lua") | Out-Null
          Copy-Item $exeName $portableDir
          Copy-Item "lua/run_in_executor.lua" (Join-Path $portableDir "lua/run_in_executor.lua")
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $zipName -CompressionLevel Optimal -Force
          $h = (Get-FileHash $exeName -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          # WriteAllLines defaults to UTF-8 without BOM. Out-File -Encoding utf8
          # on Windows PowerShell 5.1 writes a BOM, which breaks sha256sum parsing.
          [System.IO.File]::WriteAllLines("$pwd/checksums.txt", @("$h  $exeName", "$zipHash  $zipName"))
          Get-Content checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CronusLauncher-${{ env.APP_VERSION }}.exe
            CronusLauncher-${{ env.APP_VERSION }}-portable.zip
            checksums.txt
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
