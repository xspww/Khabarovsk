name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check tag matches version.py
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}".Trim()
          $line = Select-String -Path version.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $line) { Write-Error "APP_VERSION not found in version.py"; exit 1 }
          $ver = $line.Matches[0].Groups[1].Value
          if ($tag -ne "v$ver") {
            Write-Error "Tag $tag does not match version.py APP_VERSION $ver"
            exit 1
          }
          "APP_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Build exe icon
        run: python -c "from PIL import Image; Image.open('assets/cronus_icon.png').save('assets/cronus_icon.ico')"

      - name: Build exe
        run: pyinstaller cronus_launcher.spec

      - name: Smoke test (guard boot, no display needed)
        shell: powershell
        run: |
          $exe = "dist/CronusLauncher.exe"
          if (-not (Test-Path $exe)) { Write-Error "Build output missing: $exe"; exit 1 }
          $proc = Start-Process -FilePath (Resolve-Path $exe) `
            -ArgumentList "--multi-roblox-guard", "mutex", "--parent-pid", "$PID" `
            -PassThru -RedirectStandardOutput "guard_out.txt" -NoNewWindow
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path guard_out.txt -and (Select-String -Path guard_out.txt -Pattern "multi_roblox_guard_ready" -Quiet)) { $ready = $true; break }
            if ($proc.HasExited) { break }
          }
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
          if (-not $ready) { Get-Content guard_out.txt -ErrorAction SilentlyContinue; Write-Error "Smoke test failed: guard did not report ready"; exit 1 }
          Write-Host "Smoke test passed"

      - name: Package portable zip and checksums
        shell: powershell
        run: |
          $ver = "${{ env.APP_VERSION }}"
          $exeName = "CronusLauncher-$ver.exe"
          $zipName = "CronusLauncher-$ver-portable.zip"
          Copy-Item "dist/CronusLauncher.exe" $exeName
          Compress-Archive -Path $exeName, "README.md", "lua/run_in_executor.lua" -DestinationPath $zipName -Force
          $lines = foreach ($f in @($exeName, $zipName)) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          # WriteAllLines defaults to UTF-8 without BOM. Out-File -Encoding utf8
          # on Windows PowerShell 5.1 writes a BOM, which breaks sha256sum parsing.
          [System.IO.File]::WriteAllLines("$pwd/checksums.txt", $lines)
          Get-Content checksums.txt

      - name: Sign checksums (optional Ed25519)
        shell: python
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          import os
          sk_hex = (os.environ.get("UPDATE_SIGNING_KEY") or "").strip().lower()
          if not sk_hex:
              print("UPDATE_SIGNING_KEY not set; skipping checksums.txt.sig (SHA256-only release).")
              raise SystemExit(0)
          assert len(sk_hex) == 64 and all(c in "0123456789abcdef" for c in sk_hex), "UPDATE_SIGNING_KEY must be 32-byte hex"
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          sk = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(sk_hex))
          data = open("checksums.txt", "rb").read()
          sig = sk.sign(data).hex()
          open("checksums.txt.sig", "w", encoding="utf-8", newline="\n").write(sig + "\n")
          pub = sk.public_key().public_bytes_raw().hex()
          print(f"checksums.txt.sig written; pubkey={pub}")
          print("Ship this pubkey to clients via update_pubkey.hex or CRONUS_UPDATE_PUBKEY.")

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CronusLauncher-${{ env.APP_VERSION }}.exe
            CronusLauncher-${{ env.APP_VERSION }}-portable.zip
            checksums.txt
            checksums.txt.sig
          fail_on_unmatched_files: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true
