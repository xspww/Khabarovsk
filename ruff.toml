# Ruff config — signal-only ruleset.
# Excluded on purpose: BLE/S (defensive except style is intentional here,
# verified), UP006/UP035/UP045 (mass annotation churn — separate pass).
target-version = "py311"
line-length = 120

[lint]
select = [
  "E4", "E7", "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "TRY",
  "PIE",
  "RUF",
  "FURB",
  "C",
  "ASYNC",
  "PLW",
]
ignore = [
  "UP006",
  "UP035",
  "UP045",
  "BLE",
  "S",
  # Style-churn rules: valid taste, wrong time (100+ hits each, no bugs).
  "C901",
  "SIM102",
  "SIM103",
  "SIM105",
  "SIM108",
  "TRY003",
  "TRY300",
  "TRY301",
  "PLW0603",
  "E731",
  "B904",
  # Unsafe autofix (may change runtime behavior).
  "RUF046",
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
# main.py bootstraps sys.path + platform guard before local imports by design.
"main.py" = ["E402"]
# Localhost desktop server: route handlers only do trivial local ops
# (os.path checks, small file reads, fire-and-forget Popen). No executor needed.
"api_routes/accounts_routes.py" = ["ASYNC"]
"api_routes/config_routes.py" = ["ASYNC"]
"api_routes/system_routes.py" = ["ASYNC"]
# Qt virtual-method names are fixed camelCase by PySide6 (changeEvent etc.);
# renaming breaks the override, so N802 is unfixable inside the class body.
"desktop/webview_window.py" = ["N802"]
