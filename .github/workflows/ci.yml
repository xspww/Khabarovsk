name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt coverage ruff

      - name: Compile check (whole repo)
        run: python -m compileall -q .

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Unit tests with coverage (total ratchet 15% + pure-surface 43%)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m --fail-under=15
          coverage report --fail-under=43 --include="config/*,domain/*,version.py,services/browser_tracker.py,services/ban_guard.py,services/verify_guard.py,services/captcha_guard.py,services/process_proof_policy.py,services/roblox_validation.py"
